[package]
name = "civ-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.80"
description = "Simulation géopolitique pure et déterministe de Civilisations"

[features]
# Activé quand les modules sont inclus dans la crate native `civ-horizon`.
embedded-core = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
