[package]
name = "civ-horizon"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.80"
description = "Adaptateur testable entre Civilisations et Horizon"

[features]
default = ["embedded-core"]
# Les modules purs de `civ-core` sont inclus dans cette crate pour le bundle natif.
embedded-core = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
