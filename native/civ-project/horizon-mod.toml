id = "civ"
name = "Civilisations"
version = "0.1.0"
description = "Simulation geopolitique fictive pour Horizon 26.3."
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"
mixins = "5a64af938ec86b00d53d16a408aabc0038fb3e57"

[[native.module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "civ_glue"
source = "src/glue.rs"

[[native.mixin]]
id = "frame"
kind = "HEAD"
helper = "src/mixins/frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }, { name = "elapsed", ty = "std::time::Duration", value = "elapsed" }]
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
priority = 100

[[native.mixin]]
id = "mods"
kind = "HEAD"
helper = "src/mixins/mods.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }, { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
priority = 100

