[mod]
id = "civ"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# Une seule crate native : le bundle Horizon refuse les dépendances `path`
# entre crates. `civ-horizon` inclut donc les modules purs de `civ-core` à sa
# racine, tout en gardant `civ-core` comme crate autonome pour les tests.
[[crate]]
id = "civ_horizon"
path = "civ-horizon"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "civ_glue"
source = "glue.rs"

# Une frame client : avance le directeur cinématique et fait décroître les secousses.
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

# Options > Mods : décrit le mod et sa touche d'ouverture.
[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mods.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Touche configurable (J par défaut) pour ouvrir/fermer l'écran du mod.
[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

